name: Build & Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run build:check

      - name: Build library
        run: bun run build

      - name: Prepare deployment
        run: |
          mkdir -p staging/latest
          cp dist/information-dashboard.js staging/latest/
          cp dist/information-dashboard.umd.cjs staging/latest/
          
          # Create index.html
          cat > staging/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>Information Dashboard – Web Component</title>
            <style>
              body { font-family: system-ui; max-width: 800px; margin: 40px auto; padding: 20px; }
              code { background: #eee; padding: 2px 6px; }
            </style>
          </head>
          <body>
            <h1>Information Dashboard</h1>
            <p>Web Component library. See <a href="https://github.com/edgar-treischl/qtab">GitHub</a> for docs.</p>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'staging/'

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


